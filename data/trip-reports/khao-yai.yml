title: Khao Yai National Park (Thailand)
start_date: 2026-10-30
end_date: 2026-11-02
description: |
  Two day tour with [Wild Bird Eco](https://www.wildbirdeco.net/) to Khao Yai
  National Park. An overwhelming number of birds, quite frankly. Little bit of
  paddy field birding on the way back. Not great conditions for photography:
  forest birds hard at best of time, but light was also really harsh. Ended up not
  carrying my camera often.
